name: 상가 자료 자동 업데이트

on:
  schedule:
    - cron: "0 1 5 2,5,8,11 *"   # 2·5·8·11월 5일 오전 10시(한국시간)
  workflow_dispatch:             # Actions 탭에서 'Run workflow'로 바로 실행할 수도 있습니다

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 자료 만들기 (상가정보는 API로 받기)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
        run: |
          pip install numpy
          if [ -n "$SEOUL_KEY" ]; then SEOUL=--seoul; else SEOUL=; fi   # 서울시 키가 있으면 상권 매출·개폐업도 새로 받기
          python build_data.py --api $SEOUL

      - name: 자료가 바뀌었으면 저장 (브라우저가 새 자료를 받도록 버전 표시도 바꿈)
        run: |
          if git diff --quiet -- mapo-data.js; then
            echo "바뀐 자료가 없습니다."
            exit 0
          fi
          sed -i -E "s/mapo-data\.js\?v=[^\"]*/mapo-data.js?v=$(date +%Y%m%d)/" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapo-data.js index.html 원본데이터/서울상권_마포구.json
          git commit -m "자료 자동 업데이트 $(date +%Y-%m-%d)"
          git push
