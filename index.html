<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메디넷 상가 입지 리포트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* v3 레이아웃: 가운데 정렬 제목 → 왼쪽 접이식 조건 패널 + 오른쪽 지표 카드·탭 분석 (메디넷 상가 입지 리포트) */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #141c2b; --muted: #5d6779; --line: #e1e6ee;
  --sage: #3d6fa8; --sage-deep: #1d3f6e; --sage-soft: #e8eff8; --on-sage: #ffffff;
  --accent: #0f8a8a;
  --track: #e6eaf0; --warn: #9a5b06; --warn-soft: #fbf0dc; --bad: #b3372b; --bad-soft: #fbe5e2;
  --good: #1f7a55; --good-soft: #e2f3eb;
  --d1: #eaf0f8; --d2: #c9d8ec; --d3: #93b2d8; --d4: #4f7fb8; --d5: #1d3f6e; --d-ink: #141c2b; --d-ink-strong: #ffffff;
  --shadow: 0 1px 2px rgba(20, 28, 43, .05), 0 4px 16px rgba(20, 28, 43, .05);
  --btn-bg: #ffffff; --btn-ink: #141c2b; --btn-line: #d5dbe5; --pick-bg: #5b21b6; --pick-ink: #fde047;
  --display: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --body: var(--display);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #171e29; --ink: #e8edf5; --muted: #9aa6b8; --line: #2a3443;
    --sage: #7aa5dc; --sage-deep: #a9c6ee; --sage-soft: #1e2b3d; --on-sage: #0f141c; --accent: #4fc2c2;
    --track: #2a3443; --warn: #e9b765; --warn-soft: #3a2f1c; --bad: #f19a8e; --bad-soft: #43251f;
    --good: #7fd3ac; --good-soft: #1b3529;
    --d1: #1e2b3d; --d2: #27405f; --d3: #3d6194; --d4: #6a93cc; --d5: #a9c6ee; --d-ink: #e8edf5; --d-ink-strong: #0f141c;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --ink: #e8edf5; --muted: #9aa6b8; --line: #2a3443;
  --sage: #7aa5dc; --sage-deep: #a9c6ee; --sage-soft: #1e2b3d; --on-sage: #0f141c; --accent: #4fc2c2;
  --track: #2a3443; --warn: #e9b765; --warn-soft: #3a2f1c; --bad: #f19a8e; --bad-soft: #43251f;
  --good: #7fd3ac; --good-soft: #1b3529;
  --d1: #1e2b3d; --d2: #27405f; --d3: #3d6194; --d4: #6a93cc; --d5: #a9c6ee; --d-ink: #e8edf5; --d-ink-strong: #0f141c;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
.page { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; display: grid; gap: 20px; }

/* 제목: 가운데 정렬 */
header { text-align: center; padding: 32px 0 4px; display: grid; justify-items: center; gap: 8px; }
.title-line { display: inline-flex; align-items: center; gap: .36em; }
.title-line .mark { width: 1.6em; height: 1.6em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; line-height: 1; background: var(--sage-deep); color: var(--on-sage); font-size: .66em; font-weight: 800; letter-spacing: 0; flex: none; }
header h1 { font-family: var(--display); font-size: clamp(1.7rem, 3.4vw, 2.3rem); font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; margin: 6px 0 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: none; text-align: center; }
@media (min-width: 861px) { header p { white-space: nowrap; } }
.sample-note { display: inline-block; margin-top: 4px; padding: 5px 14px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: .86rem; }

/* 본문 2단: 조건 패널 + 분석 */
.work { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }
.side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.side-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--line); font-weight: 700; }
.side-head small { color: var(--muted); font-weight: 400; font-size: .82rem; }
.form { display: grid; gap: 0; min-width: 0; padding: 4px 18px 18px; }
fieldset { border: 0; margin: 0; padding: 14px 0; display: grid; gap: 12px; min-width: 0; border-bottom: 1px solid var(--line); }
fieldset:last-of-type { border-bottom: 0; }
legend { float: left; width: 100%; padding: 0; margin: 0; font-size: .98rem; font-weight: 700; display: flex; justify-content: space-between; gap: 12px; align-items: center; cursor: pointer; user-select: none; }
legend::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 0; transition: transform .15s; flex: none; }
legend small { font-size: .8rem; font-weight: 500; color: var(--muted); margin-left: auto; margin-right: 6px; }
legend:not(:has(small))::after { margin-left: auto; }
fieldset.closed > :not(legend) { display: none !important; }
fieldset.closed legend::after { transform: rotate(-45deg); margin-bottom: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .q { font-weight: 600; font-size: .9rem; }
textarea { width: 100%; padding: 8px 12px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
input[type="text"], input[type="number"] { width: 100%; min-height: 42px; padding: 8px 12px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
input[type="text"]:focus, input[type="number"]:focus, textarea:focus { border-color: var(--sage); outline: 0; box-shadow: 0 0 0 3px var(--sage-soft); }
.file-btn { display: inline-flex; align-items: center; min-height: 38px; padding: 6px 14px; font-weight: 400; font-size: .9rem; color: var(--btn-ink); border: 1px solid var(--btn-line); border-radius: 8px; cursor: pointer; position: relative; background: var(--btn-bg); }
.file-btn:hover { border-color: var(--pick-bg); }
.file-btn:active { background: var(--pick-bg); border-color: var(--pick-bg); color: var(--pick-ink); font-weight: 700; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: flex; align-items: center; min-height: 36px; padding: 5px 12px; border: 1px solid var(--btn-line); border-radius: 8px; background: var(--btn-bg); color: var(--btn-ink); font-size: .9rem; font-weight: 400; transition: background .12s, color .12s, border-color .12s; }
.chip:hover span { border-color: var(--pick-bg); }
.chip input:checked + span { background: var(--pick-bg); border-color: var(--pick-bg); color: var(--pick-ink); font-weight: 700; }
.chip input:focus-visible + span, button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
.help { color: var(--muted); font-size: .84rem; margin: 0; line-height: 1.5; }
button { min-height: 38px; padding: 6px 14px; font: inherit; font-size: .9rem; font-weight: 400; color: var(--btn-ink); background: var(--btn-bg); border: 1px solid var(--btn-line); border-radius: 8px; cursor: pointer; justify-self: start; transition: background .12s, color .12s, border-color .12s; }
button:hover { border-color: var(--pick-bg); }
button:active, button[aria-pressed="true"] { background: var(--pick-bg); border-color: var(--pick-bg); color: var(--pick-ink); font-weight: 700; }
.suggest { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
[hidden] { display: none !important; }
.suggest li + li { border-top: 1px solid var(--line); }
.suggest button { display: block; width: 100%; min-height: 42px; border: 0; border-radius: 0; color: var(--ink); text-align: left; font-weight: 500; background: transparent; }
.suggest button:hover { background: var(--sage-soft); }
.suggest button:active { background: var(--pick-bg); color: var(--pick-ink); font-weight: 700; }
.suggest button:active small { color: var(--pick-ink); }
.suggest small { display: block; color: var(--muted); font-weight: 400; }
.addr-state { margin: 0; font-size: .84rem; color: var(--good); font-weight: 500; }
.addr-state.miss { color: var(--warn); }

/* 분석 영역 */
.report { min-width: 0; display: grid; gap: 16px; scroll-margin-top: 12px; }
/* PC: 오른쪽 리포트도 자체 스크롤 (조건 설정과 따로 움직임), 탭 줄은 리포트 위쪽에 고정 */
@media (min-width: 861px) {
  .page { padding-bottom: 12px; }
  .work { height: calc(100vh - 24px); align-items: stretch; }
  .side { position: static; max-height: none; height: 100%; overscroll-behavior: contain; }
  .report { height: 100%; overflow-y: auto; overscroll-behavior: contain; align-content: start; padding: 0 6px 6px 2px; }
  .report .tabs { position: sticky; top: 0; z-index: 3; }
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.actions button:disabled { opacity: .6; cursor: default; }
.action-note { flex: 1 1 100%; margin: 0; color: var(--muted); font-size: .86rem; text-align: right; }
.action-note:empty { display: none; }
.report-body { display: grid; gap: 16px; min-width: 0; }
.report-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 2px 16px; padding: 18px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.report-head .kind { font-size: .84rem; color: var(--muted); }
.report-head > .kind:first-child { grid-column: 1; grid-row: 1; }
.report-head h2 { grid-column: 1; grid-row: 2; }
.report-head > .kind:not(:first-child) { grid-column: 2; text-align: right; }
.report-head > .kind:nth-child(3) { grid-row: 1; }
.report-head > .kind:nth-child(4) { grid-row: 2; }
.report-head h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; margin: 2px 0 0; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--sage-soft); color: var(--sage-deep); font-weight: 600; font-size: .8rem; }

/* 지표 카드 */
.kpis { display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; display: grid; align-content: start; gap: 2px; }
.kpi span { color: var(--muted); font-size: .8rem; font-weight: 600; }
.kpi b { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi small { color: var(--muted); font-size: .8rem; line-height: 1.4; }
.kpi.main { background: var(--sage-deep); border-color: var(--sage-deep); color: var(--on-sage); }
.kpi.main span, .kpi.main small { color: var(--on-sage); opacity: .82; }
.kpi.main .score { color: var(--on-sage); }
.score { font-size: 2.6rem; line-height: 1.05; font-weight: 800; letter-spacing: -0.04em; color: var(--sage-deep); font-variant-numeric: tabular-nums; }
.score small { font-size: 1rem; font-weight: 500; opacity: .75; }
.verdict b { display: block; font-size: 1rem; font-weight: 700; }
.verdict span { font-size: .8rem; }

/* 탭 */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; scrollbar-width: none; box-shadow: var(--shadow); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; border: 1px solid transparent; background: var(--btn-bg); color: var(--btn-ink); min-height: 40px; border-radius: 8px; white-space: nowrap; }
.tabs button:hover { border-color: var(--pick-bg); }
.tabs button[aria-selected="true"] { background: var(--pick-bg); border-color: var(--pick-bg); color: var(--pick-ink); font-weight: 700; }
.panel { display: grid; gap: 16px; min-width: 0; }
.panel-title { display: none; margin: 8px 0 0; font-size: 1.15rem; font-weight: 800; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.report-body[data-tab] .panel { display: none; }
.report-body[data-tab="sum"] .panel[data-panel="sum"], .report-body[data-tab="place"] .panel[data-panel="place"],
.report-body[data-tab="pop"] .panel[data-panel="pop"], .report-body[data-tab="rent"] .panel[data-panel="rent"],
.report-body[data-tab="check"] .panel[data-panel="check"] { display: grid; }
.report-body:not([data-tab]) .panel-title { display: block; }
.report-body:not([data-tab]) .tabs { display: none; }

/* 카드 블록 */
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.block h3 { font-size: 1rem; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.block h3::before { content: ""; width: 4px; height: 1em; border-radius: 2px; background: var(--accent); }
.block ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.scale { display: grid; grid-template-columns: 20fr 10fr 30fr 20fr 20fr; gap: 3px; margin-bottom: 4px; }
.seg { min-width: 0; }
.seg i { display: block; height: 10px; background: var(--track); overflow: hidden; border-radius: 3px; }
.seg i b { display: block; height: 100%; background: var(--sage); }
.seg em { display: block; font-style: normal; font-size: .74rem; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 7.5em 4.4em minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.row:last-child { border-bottom: 0; }
.row .pts { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.row .pts small { font-weight: 400; color: var(--muted); }
.row p { margin: 0; color: var(--muted); }
.flag { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; padding: 8px 12px; border-radius: 8px; font-size: .92rem; }
.flag b { flex: none; font-size: .84rem; }
.flag.ok { background: var(--good-soft); } .flag.ok b { color: var(--good); }
.flag.wait { background: var(--warn-soft); } .flag.wait b { color: var(--warn); }
.flag.stop { background: var(--bad-soft); } .flag.stop b { color: var(--bad); }
.summary { margin: 0; }
.checks li { padding-left: 1.5em; text-indent: -1.5em; }
.checks li::before { content: "□"; display: inline-block; width: 1.5em; text-indent: 0; color: var(--sage-deep); }
.foot { padding: 14px 4px 0; font-size: .82rem; color: var(--muted); text-align: center; display: grid; gap: 2px; }
.foot p { margin: 0; }
.foot p:first-child { font-weight: 700; color: var(--ink); }
.mini { display: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.fact { padding: 10px 12px; background: var(--bg); border-radius: 8px; }
.fact span { display: block; color: var(--muted); font-size: .82rem; }
.fact b { font-size: 1.1rem; font-weight: 800; }
.bars { display: grid; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.bars li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3em; gap: 8px; align-items: center; font-size: .9rem; }
.bars i { display: block; height: 10px; background: var(--track); border-radius: 3px; position: relative; }
.bars i b { display: block; height: 100%; background: var(--sage); border-radius: 3px; }
.bars span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.bars i u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); text-decoration: none; }
.bars.stack s { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sage-deep); text-decoration: none; border-radius: 3px; }
.bars.stack b { background: var(--d2); }
.bars.pareto li { grid-template-columns: 7.5em minmax(0, 1fr) 5.6em; }
.bars.pareto small { color: var(--muted); }
.near { display: grid; gap: 4px; }
.near li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-block: 5px; font-size: .92rem; }
.near span:last-child { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.caution { margin: 10px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: .9rem; }
.map-wrap { display: grid; gap: 8px; }
.map-wrap canvas { display: block; width: 100%; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
.map-link { color: var(--sage-deep); font-weight: 600; font-size: .9rem; }
.heat { display: grid; gap: 6px; margin-top: 10px; }
.heat.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.heat.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.heat div { padding: 10px 8px; border-radius: 8px; text-align: center; min-width: 0; }
.heat span { display: block; font-size: .82rem; }
.heat b { display: block; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.heat .d1 { background: var(--d1); color: var(--d-ink); } .heat .d2 { background: var(--d2); color: var(--d-ink); }
.heat .d3 { background: var(--d3); color: var(--d-ink); } .heat .d4 { background: var(--d4); color: var(--d-ink-strong); }
.heat .d5 { background: var(--d5); color: var(--d-ink-strong); }
.range { position: relative; height: 12px; margin: 14px 0 8px; background: var(--track); border-radius: 3px; }
.range i { position: absolute; top: 0; bottom: 0; background: var(--sage); border-radius: 3px; }
.range u { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); text-decoration: none; }
.ai-block { background: var(--sage-soft); border-color: transparent; }
.ai-text { white-space: pre-line; margin: 0; }
.ai-mark { margin: 8px 0 0; color: var(--muted); font-size: .84rem; }
#aiCopy { margin-top: 10px; }
.sub { margin: 0 0 8px; color: var(--muted); font-size: .84rem; }
.trend { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
.trend li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: .9rem; }
.trend i { display: block; height: 10px; background: var(--track); border-radius: 3px; }
.trend i b { display: block; height: 100%; background: var(--sage); border-radius: 3px; }
.trend small { color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 0 6px; margin-left: 6px; border-radius: 4px; vertical-align: middle; background: var(--sage-soft); color: var(--sage-deep); }
.tag.hand { background: var(--warn-soft); color: var(--warn); }
.assume { font-size: .86rem; color: var(--muted); margin: 0; }
.assume li { padding-left: 1em; text-indent: -1em; }
.diag li { display: grid; grid-template-columns: 7em auto 4.6em minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.diag li:last-child { border-bottom: 0; }
.diag .dm { display: inline-flex; gap: 3px; }
.diag .dm i { width: 18px; height: 8px; background: var(--track); border-radius: 2px; }
.diag .dm i.on { background: var(--sage-deep); }
.diag b { font-size: .88rem; }
.diag small { color: var(--muted); font-size: .84rem; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.tbl th, .tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--muted); font-weight: 600; background: var(--bg); }

    const t = e.target;
    if (!t.name) return;
    if (t.id === "fieldImport") return;
    state[t.name] = t.type === "number" || t.name === "fieldAdj" ? Number(t.value) : t.value;
    if (t.name === "fieldAdj" || t.name === "fieldNote") storeField();
    if (t.name === "address") {
      place = findAddress(t.value);
      manual.clear();
      showSuggestions(place ? [] : suggestAddresses(t.value));
      loadField();
    }
    if (t.name === "customBiz") {
      showBizSuggestions(t.value);
      setCustomType();
    }
    if (t.name === "biz" || t.name === "customBiz") manual.delete("compete");
    if (t.name === "deposit") depositManual = true;
    if (t.name === "zone") manual.add("zone");
    if (AUTO_KEYS.includes(t.name)) manual.add(t.name);
    render();
  });
  document.getElementById("suggest").addEventListener("click", e => {
    const pick = e.target.closest("button");
    if (!pick) return;
    choosePlace(DATA.addr[Number(pick.dataset.index)]);
  });
  document.getElementById("bizSuggest").addEventListener("click", e => {
    const pick = e.target.closest("button");
    if (!pick) return;
    state.customBiz = pick.dataset.name;
    document.getElementById("customBiz").value = pick.dataset.name;
    showBizSuggestions("");
    setCustomType();
    manual.delete("compete");
    render();
  });
  document.getElementById("reset").addEventListener("click", () => {
    showBizSuggestions("");
    depositManual = false;
    state = { ...SAMPLE };
    place = findAddress(state.address);
    manual.clear();
    showSuggestions([]);
    fillForm();
    loadField();
    render();
  });
  document.getElementById("fieldExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(fieldStore(), null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `현장의견_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
  document.getElementById("fieldImport").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const incoming = JSON.parse(await file.text());
      if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) throw new Error("형식");
      const merged = { ...fieldStore(), ...incoming };
      setNote(fieldSave(merged) ? `현장 의견 ${Object.keys(incoming).length}건을 불러왔습니다.` : "이 브라우저에서는 현장 의견을 저장할 수 없습니다.");
      loadField();
      render();
    } catch (err) {
      setNote("현장 의견 파일을 읽지 못했습니다. 내보내기로 만든 파일인지 확인하세요.");
    }
    e.target.value = "";
  });
  place = findAddress(state.address);
  loadField();
  render();
  startActions();
}
function showBizSuggestions(text) {
  const box = document.getElementById("bizSuggest");
  const key = squeeze(text);
  const exact = DATA.cats.some(c => squeeze(c) === key);
  const list = key && !exact ? [...customCats(text)].slice(0, 6).map(i => DATA.cats[i]) : [];
  box.hidden = !list.length;
  box.innerHTML = list.map(c => `<li><button type="button" data-name="${esc(c)}">${esc(c)}</button></li>`).join("");
}
function setCustomType() {
  const first = [...customCats(state.customBiz)][0];
  if (first === undefined) return;
  state.customType = DATA.catTop[first] === "음식" ? "cluster" : "local";
  document.getElementById("form").elements.customType.value = state.customType;
}
function choosePlace(a) {
  place = a;
  state.address = a[0];
  manual.clear();
  document.getElementById("address").value = a[0];
  showSuggestions([]);
  loadField();
  render();
}
function showSuggestions(list) {
  const box = document.getElementById("suggest");
  box.hidden = !list.length;
  box.innerHTML = list.map(a => `<li><button type="button" data-index="${DATA.addr.indexOf(a)}">${esc(a[0])}<small>${esc(a[1])}</small></button></li>`).join("");
}
start();
</script>
