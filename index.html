<style>
/* Layout: 왼쪽은 현장 입력지, 오른쪽은 그 자리에서 채워지는 입지 확인서 */

    --good: #93cfa9; --good-soft: #233a2c;
    --d1: #27332c; --d2: #34483d; --d3: #4a6a58; --d4: #6b9079; --d5: #a6c6b1; --d-ink: #e8eee9; --d-ink-strong: #14201a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161b18; --surface: #1f2622; --ink: #e8eee9; --muted: #a5b2a9; --line: #38443d;
  --sage: #8fae9b; --sage-deep: #b5cdbd; --sage-soft: #2d3a33; --on-sage: #14201a;

    --d1: #27332c; --d2: #34483d; --d3: #4a6a58; --d4: #6b9079; --d5: #a6c6b1; --d-ink: #e8eee9; --d-ink-strong: #14201a; color-scheme: dark;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }

header h1 { font-family: var(--display); font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }

.chip { position: relative; }

.chip span { display: flex; align-items: center; min-height: 42px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }

button { min-height: 44px; padding: 8px 16px; font: inherit; font-weight: 500; color: var(--sage-deep); background: transparent; border: 1px solid var(--sage); border-radius: 6px; cursor: pointer; justify-self: start; }
.report { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: clamp(18px, 3vw, 30px); display: grid; gap: 22px; scroll-margin-top: 12px; }

.scale { display: grid; grid-template-columns: 20fr 10fr 30fr 20fr 20fr; gap: 3px; }

.action-note:empty { display: none; }
.report-body { display: grid; gap: 22px; min-width: 0; }

.map-link { color: var(--sage-deep); font-weight: 500; }
.heat { display: grid; gap: 4px; margin-top: 10px; }
.heat.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.heat.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.heat div { padding: 10px 8px; border-radius: 4px; text-align: center; min-width: 0; }
.heat span { display: block; font-size: .86rem; }
.heat b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.heat .d1 { background: var(--d1); color: var(--d-ink); } .heat .d2 { background: var(--d2); color: var(--d-ink); }
.heat .d3 { background: var(--d3); color: var(--d-ink); } .heat .d4 { background: var(--d4); color: var(--d-ink-strong); }
.heat .d5 { background: var(--d5); color: var(--d-ink-strong); }
.range { position: relative; height: 14px; margin: 14px 0 8px; background: var(--track); }
.range i { position: absolute; top: 0; bottom: 0; background: var(--sage); }
.range u { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); text-decoration: none; }
.ai-block { padding: 14px 16px; border-radius: 6px; background: var(--sage-soft); }
.ai-text { white-space: pre-line; margin: 0; }

@media (min-width: 861px) { .report { max-height: calc(100vh - 32px); overflow-y: auto; } }
@media (max-width: 860px) {

}

}
@media (prefers-reduced-motion: no-preference) { .seg i b { transition: width .25s ease; } }
</style>

<script>
const BIZ = {
  cafe:    { label: "카페",   type: "cluster", fit: { young: 20, tour: 20, office: 14, local: 8 } },
  food:    { label: "음식점", type: "cluster", fit: { young: 20, office: 20, tour: 14, local: 14 } },

  laundry: { label: "세탁소", type: "local",   fit: { local: 20, office: 14, young: 8, tour: 8 } },
  store:   { label: "편의점", type: "local",   fit: { local: 20, office: 20, young: 14, tour: 14 } }
};
const CUSTOMERS = { young: "20·30대", office: "직장인", local: "동네 주민", tour: "관광객·방문객" };
const LOCATION = [
  { key: "station", q: "역과의 거리", opts: [["near", "도보 5분 이내", 5], ["mid", "도보 10분 이내", 3], ["far", "도보 10분 초과", 1]] },
  { key: "road", q: "접한 길", opts: [["main", "대로·주요 골목", 5], ["side", "일반 골목", 3], ["back", "안쪽 이면도로", 1]] },
  { key: "access", q: "찾아오기", opts: [["easy", "쉬움", 5], ["mid", "보통", 3], ["hard", "어려움", 1]] }
];
const FLOORS = [["basement", "지하", 1], ["first", "1층", 5], ["second", "2층", 3], ["upper", "3층 이상", 1]];
const VISIBILITY = [["good", "잘 보임"], ["poor", "잘 안 보임"]];
const UPPER_OK = /학원|요가|필라테스|의원|병원|치과/;
function upperFriendly(s) {
  if (s.biz !== "custom") return false;
  return [...customCats(s.customBiz)].some(i => UPPER_OK.test(DATA.cats[i]) && DATA.cats[i] !== "동물병원");
}
function floorScore(s) {
  const base = s.storeFloor === "upper" && upperFriendly(s) ? 3 : FLOORS.find(f => f[0] === s.storeFloor)[2];
  return s.visibility === "poor" ? Math.max(1, base - 2) : base;
}
const RENT_ZONES = [
  ["zone1", "1권역 관문·숲길", 30, 45], ["zone2", "2권역 동진시장·끼리끼리길", 25, 30], ["zone3", "3권역 세모길·카페거리", 15, 20],
  ["zone4", "4권역 커뮤니티센터·벚꽃길", 20, 25], ["zone5", "5권역 서측 연남로", 15, 25]
];
const FLOOR_RENT = { basement: 0.75, first: 1, second: 0.75, upper: 0.7 };
const DEPOSIT_MONTHS = 20;
function zoneFromPlace() {
  return place && place[5] ? `zone${place[5]}` : "";
}
function applyZone() {
  const box = document.getElementById("form").elements.zone;
  if (!manual.has("zone")) state.zone = zoneFromPlace();
  [...box].forEach(radio => { radio.checked = radio.value === state.zone; });
  const help = document.getElementById("zoneHelp");
  if (help) help.textContent = manual.has("zone") ? "직접 고른 권역입니다." : state.zone ? "권역 지도 기준으로 자동 선택했습니다. 다르면 직접 고르세요." : "지도의 권역 경계 밖에 있는 주소입니다. 권역을 직접 고르세요.";
}
const CONVERSION_RATE = 0.06;
const FLOW = [
  { key: "weekday", q: "오후 (11~17시)", rank: "day" },
  { key: "evening", q: "저녁 (17~21시)", rank: "eve" },
  { key: "weekend", q: "주말 (토·일)", rank: "end" }
];
const TIME_LABELS = ["0~6시", "6~11시", "11~14시", "14~17시", "17~21시", "21~24시"];
const AGE_LABELS = ["10대", "20대", "30대", "40대", "50대", "60대 이상"];
const AUTO_KEYS = ["compete", "weekday", "evening", "weekend", "customer"];
const FLOW_OPTS = [["high", "많음", 10], ["mid", "보통", 6], ["low", "적음", 2]];
const COMPETE = { cluster: { dense: 6, many: 10, mid: 7, few: 4 }, local: { few: 10, mid: 6, many: 2, dense: 0 } };
const COMPETE_LABEL = { dense: "과밀", many: "많음", mid: "보통", few: "적음" };
const DENSE_RATIO = 2;
const RISKS = [
  { key: "use", label: "건축물 용도·위반건축물" },
  { key: "utility", label: "전기·가스·배기·정화조" },
  { key: "premium", label: "권리금 수준과 근거" },
  { key: "landlord", label: "임대인·재건축·명도 계획" }
];
const RISK_OPTS = [["ok", "확인함"], ["wait", "미확인"], ["stop", "문제 있음"]];
const FIELD_CHECKS = {
  cluster: ["같은 업종 가게 중 손님이 많은 곳과 빈 곳을 나눠 보기", "점심과 저녁 시간에 줄이 생기는 가게 확인하기"],
  local: ["주변 주거 세대와 기존 단골 가게 확인하기", "가까운 경쟁 점포의 영업시간과 가격 비교하기"]
};
const SAMPLE = {
  address: "연남동 229-64", biz: "cafe", customer: "young", compete: "many",
  storeFloor: "first", visibility: "good", station: "mid", road: "main", access: "easy",
  customBiz: "", customType: "cluster", customCore: "young",
  weekday: "mid", evening: "high", weekend: "high", rent: 450, deposit: 9000, area: 66, zone: "zone1", marketRent: 0,
  use: "ok", utility: "wait", premium: "wait", landlord: "ok"
};
let state = { ...SAMPLE };
let place = null;
const manual = new Set();
let depositManual = false;

function rankLevel(rank) {
  const third = DATA.pop.n / 3;
  if (rank <= third) return "high";
  return rank > third * 2 ? "low" : "mid";
}
function applyDong(dong) {
  FLOW.forEach(item => {
    if (!manual.has(item.key)) state[item.key] = rankLevel(dong[item.rank]);
  });
  if (!manual.has("customer")) state.customer = rankLevel(dong.ry) === "high" ? "young" : "local";
}

const RADIUS = 300;
const METERS = { lat: 1.11195, lng: 1.11195 * Math.cos(37.55 * Math.PI / 180) };
const cleanAddress = t => String(t).replace(/서울특별시|서울시|서울|마포구|\s/g, "");
const ADDRESS_INDEX = new Map();
DATA.addr.forEach(a => {
  ADDRESS_INDEX.set(cleanAddress(a[0]), a);
  if (a[1]) ADDRESS_INDEX.set(cleanAddress(a[1]), a);
});
function findAddress(text) {
  return ADDRESS_INDEX.get(cleanAddress(text)) || null;
}
function suggestAddresses(text) {
  const key = cleanAddress(text);
  if (key.length < 2) return [];
  const found = [];

  const margin = 10, width = 190, height = 277, gap = 5;

  let y = margin;

      const fullHeight = canvas.height * width / canvas.width;
      if (y > margin && y + fullHeight > margin + height) { pdf.addPage(); y = margin; }
      let top = 0;
      while (top < canvas.height) {
        const room = Math.floor((margin + height - y) * canvas.width / width);
        const piece = Math.min(room, canvas.height - top);
        const page = document.createElement("canvas");

        const ctx = page.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, page.width, page.height);

        const pieceHeight = piece * width / canvas.width;
        pdf.addImage(page.toDataURL("image/jpeg", 0.92), "JPEG", margin, y, width, pieceHeight);

        if (top < canvas.height) { pdf.addPage(); y = margin; }
      }
    }
  } finally {
    holder.remove();
  }
  const pages = pdf.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {

    r.price.range ? `적정 월세 ${won(r.price.range.low)}~${won(r.price.range.high)}. 입력 월세 ${won(state.rent)}은 ${r.price.range.position}.${r.price.range.below ? " 낮은 이유를 확인하기 전까지 4점을 뺐습니다." : ""}` :
    `평당 월세 ${r.price.unit.toFixed(1)}만원. 주변 평균 ${state.marketRent}만원보다 ${Math.abs(Math.round(r.price.gap * 100))}% ${r.price.gap >= 0 ? "높습니다" : "낮습니다"}.`;
  document.getElementById("zoneBox").hidden = !inYeonnam();
  document.getElementById("marketBox").hidden = inYeonnam();
  document.getElementById("depositHelp").textContent = depositManual
    ? `직접 고친 금액입니다. 칸을 비우면 월세의 ${DEPOSIT_MONTHS}배로 다시 자동 입력됩니다.`
    : `월세의 ${DEPOSIT_MONTHS}배로 자동 입력됩니다. 다르면 직접 고치세요.`;
  document.getElementById("areaHelp").textContent = state.area > 0
    ? `약 ${r.price.pyeong.toFixed(1)}평${r.price.unit ? `, 평당 월세 ${r.price.unit.toFixed(1)}만원` : ""}`
    : "전용면적을 넣으면 평수와 평당 월세를 계산합니다.";
  const countText = around && !around.noMatch ? `반경 300m ${around.count}곳, ` : "";
  const manualText = around && (around.noMatch || manual.has("compete")) ? " 직접 고른 값입니다." : "";
  const flowWhy = FLOW.map(i => `${i.q.split(" ")[0]} ${FLOW_OPTS.find(o => o[0] === state[i.key])[1]}`).join(", ") + ".";
  const customerWhy = dong
    ? `20·30대 비중 ${dong.young}%. ${CUSTOMERS[state.customer]} 기준으로 계산했습니다.`
    : `${CUSTOMERS[state.customer]} 중심 상권입니다.`;
  const competeWhy = biz.type === "cluster"
    ? `${topic(biz.label)} 모일수록 유리한 업종입니다. ${countText}${COMPETE_LABEL[state.compete]}.${state.compete === "dense" ? " 다만 많음 기준의 2배를 넘어 경쟁 부담을 반영했습니다." : ""}${manualText}`
    : `${topic(biz.label)} 많으면 불리한 업종입니다. ${countText}${COMPETE_LABEL[state.compete]}.${manualText}`;
  const th = thresholds(state);
  const rule = th ? `마포구 주소 기준 ${th.low}곳 이하는 적음, ${th.high}곳 이상은 많음, ${th.high * DENSE_RATIO}곳 이상은 과밀로 자동 선택합니다.` : "자료에서 찾지 못한 업종은 직접 고르세요.";
  const bizState = document.getElementById("bizState");
  bizState.className = !custom || th ? "addr-state" : "addr-state miss";
  const catCount = customCats(state.customBiz).size;
  bizState.textContent = !state.customBiz.trim() ? "업종을 입력하세요." : !th ? "마포구 상가 자료에서 찾지 못했습니다. 주변 동일업종을 직접 고르세요." :
    catCount ? `상가 자료의 업종 분류 ${catCount}개로 집계합니다.` : "상호에 이 단어가 들어간 점포로 집계합니다.";
  document.getElementById("competeHelp").textContent = (biz.type === "cluster"
    ? `${topic(biz.label)} 거리 자체가 손님을 끌어 많을수록 점수가 높습니다. `
    : `${topic(biz.label)} 동네 손님을 나눠 가져 적을수록 점수가 높습니다. `) + rule;
  const addrState = document.getElementById("addrState");
  addrState.className = place ? "addr-state" : "addr-state miss";
  addrState.textContent = place ? `찾았습니다. 도로명: ${place[1]}` : "목록에서 주소를 고르세요. 상가 자료에 있는 마포구 주소만 찾을 수 있습니다.";
  const flags = RISKS.map(item => {
    const status = RISK_OPTS.find(o => o[0] === state[item.key]);
    return `<li class="flag ${status[0]}"><span>${item.label}</span><b>${status[1]}</b></li>`;
  }).join("");
  currentFacts = JSON.stringify({
    주소: state.address, 희망업종: biz.label, 총점: r.total, 판정: v[0], 희망월세: `${state.rent}만원`, 전용면적: `${state.area}㎡`,
    층수: FLOORS.find(f => f[0] === state.storeFloor)[1],
    항목별점수: Object.fromEntries(compared.map(s => [s[0], `${s[1]}/${s[2]}`])),
    점수방식: r.priceKnown ? "100점 만점" : "가격 비교 불가, 나머지 80점을 100점으로 환산",
    월세: gapText, 주변상가: around ? { 반경: "300m", 같은업종수: around.count, 수준: COMPETE_LABEL[state.compete], 주요상권: area, 많은업종: around.top.map(t => `${t[0]} ${t[1]}곳`) } : "자동 집계 없음",
    유동인구: dong ? { 단위: "행정동 전체", 동: dong.name, 비교기준: "서울 평균 동을 1로 본 배수", 오전: dong.dense.am, 오후: dong.dense.pm, 저녁: dong.dense.eve, 평일: dong.dense.wk, 주말: dong.dense.we, 전년동기대비: `${dong.yoy}%`, 이십삼십대비중: `${dong.young}%` } : "자동 집계 없음",
    주고객층: CUSTOMERS[state.customer],
    공공참고임대료: rebRent() ? `${rebRent().name} 상권 평당 ${rebRent().pyeong.toFixed(1)}만원(1층, 전용+공용 면적, 보증금 환산 포함, 전용 평당과 직접 비교 불가)` : "없음",
    "계약 전 확인": Object.fromEntries(RISKS.map(item => [item.label, RISK_OPTS.find(o => o[0] === state[item.key])[1]]))
  });
  if (aiBusy && aiFacts !== currentFacts) aiControl?.abort();
  if (!aiBusy) document.getElementById("aiBtn").textContent = aiFacts === currentFacts && aiText ? "AI 문장 다시 만들기" : "AI 상담 문장 만들기";
  document.getElementById("reportBody").innerHTML = `
    <div class="report-head"><span class="kind">입지 리포트 · ${biz.label} 창업 검토</span><h2>${esc(state.address || "주소를 입력하세요")}</h2>${inYeonnam() && state.zone ? `<span class="kind">${esc(RENT_ZONES.find(z => z[0] === state.zone)[1])}</span>` : ""}<span class="kind">작성일 ${new Date().toLocaleDateString("ko-KR")}</span></div>
    <div class="result"><div class="score">${r.total}<small> /100</small></div><div class="verdict"><b>${v[0]}</b><span>${v[1]}</span></div></div>
    <div class="scale" role="img" aria-label="항목별 득점 막대. 총 ${r.total}점">${scores.map(s => seg(...s)).join("")}</div>
    <div class="rows">
      ${row("위치", r.location, 20, `${FLOORS.find(f => f[0] === state.storeFloor)[1]}, 밖에서 ${VISIBILITY.find(o => o[0] === state.visibility)[1]}. ${state.storeFloor === "upper" && upperFriendly(state) ? "윗층이 괜찮은 업종이라 층수 점수를 3점으로 봅니다. " : ""}역 거리, 접한 길, 층과 가시성, 찾아오기를 5점씩 봅니다.`)}
      ${row("주변 동일업종", r.compete, 10, competeWhy)}
      ${row("유동인구", r.flow, 30, flowWhy)}
      ${row("주 고객층", r.customer, 20, customerWhy)}
      ${r.priceKnown ? row("가격 수준", r.price.pts, 20, gapText) : `<div class="row"><b>가격 수준</b><span class="pts"><small>비교 불가</small></span><p>${gapText}</p></div>`}
    </div>
    <div class="block"><h3>상담 요약</h3><p class="summary">${summaryText}</p></div>
    ${zoneMapBlock()}
    ${mapBlock()}
    ${priceBlock(r.price.range)}
    ${rebBlock()}
    ${placeBlock(biz, around, area)}
    ${dong ? dongBlock(dong) : ""}
    ${aiBlock()}
    <div class="block"><h3>계약 전 확인</h3><ul>${flags}</ul></div>
    <div class="block"><h3>현장에서 볼 것</h3><ul class="checks">${FIELD_CHECKS[biz.type].map(t => `<li>${t}</li>`).join("")}</ul></div>
    <div class="foot"><p>메디넷부동산공인중개사사무소 · 대표 정영숙 · 02-3141-8837</p><p>이 점수는 상담 참고용이며 계약 판단을 대신하지 않습니다.</p><p>자료: 소상공인시장진흥공단 상가(상권)정보 ${SRC.shops}, 주요상권 ${SRC.areas} 기준, 서울시 상권분석서비스 길단위인구 ${DATA.pop.q}, 한국부동산원 상업용부동산 임대동향조사 ${SRC.reb}. 유동인구는 가게 앞이 아니라 행정동 전체 값입니다.</p></div>`;
  document.getElementById("mini").innerHTML = `<span>${r.total}점 · ${v[0]}</span><span>리포트 보기</span>`;
  paintMap();
  paintZoneMap();
}
function start() {
  buildForm();
  fillForm();
  const form = document.getElementById("form");
  form.addEventListener("submit", e => e.preventDefault());
  form.addEventListener("change", e => {
    if (e.target.name === "deposit" && e.target.value === "") {
      depositManual = false;
      render();
    }
  });
  form.addEventListener("input", e => {
    const t = e.target;
    if (!t.name) return;
    state[t.name] = t.type === "number" ? Number(t.value) : t.value;
    if (t.name === "address") {
      place = findAddress(t.value);
      manual.clear();
      showSuggestions(place ? [] : suggestAddresses(t.value));
    }
    if (t.name === "customBiz") {
      showBizSuggestions(t.value);
      setCustomType();
    }
    if (t.name === "biz" || t.name === "customBiz") manual.delete("compete");
    if (t.name === "deposit") depositManual = true;
    if (t.name === "zone") manual.add("zone");
    if (AUTO_KEYS.includes(t.name)) manual.add(t.name);
    render();
  });
  document.getElementById("suggest").addEventListener("click", e => {
    const pick = e.target.closest("button");
    if (!pick) return;
    choosePlace(DATA.addr[Number(pick.dataset.index)]);
  });
  document.getElementById("bizSuggest").addEventListener("click", e => {
    const pick = e.target.closest("button");
    if (!pick) return;
    state.customBiz = pick.dataset.name;
    document.getElementById("customBiz").value = pick.dataset.name;
    showBizSuggestions("");
    setCustomType();
    manual.delete("compete");
    render();
  });
  document.getElementById("reset").addEventListener("click", () => {
    showBizSuggestions("");
    depositManual = false;
    state = { ...SAMPLE };
    place = findAddress(state.address);
    manual.clear();
    showSuggestions([]);
    fillForm();
    render();
  });
  place = findAddress(state.address);
  render();
  startActions();
}
function showBizSuggestions(text) {
  const box = document.getElementById("bizSuggest");
  const key = squeeze(text);
  const exact = DATA.cats.some(c => squeeze(c) === key);
  const list = key && !exact ? [...customCats(text)].slice(0, 6).map(i => DATA.cats[i]) : [];
  box.hidden = !list.length;
  box.innerHTML = list.map(c => `<li><button type="button" data-name="${esc(c)}">${esc(c)}</button></li>`).join("");
}
function setCustomType() {
  const first = [...customCats(state.customBiz)][0];
  if (first === undefined) return;
  state.customType = DATA.catTop[first] === "음식" ? "cluster" : "local";
  document.getElementById("form").elements.customType.value = state.customType;
}
function choosePlace(a) {
  place = a;
  state.address = a[0];
  manual.clear();
  document.getElementById("address").value = a[0];
  showSuggestions([]);
  render();
}
function showSuggestions(list) {
  const box = document.getElementById("suggest");
  box.hidden = !list.length;
  box.innerHTML = list.map(a => `<li><button type="button" data-index="${DATA.addr.indexOf(a)}">${esc(a[0])}<small>${esc(a[1])}</small></button></li>`).join("");
}
start();
</script>
